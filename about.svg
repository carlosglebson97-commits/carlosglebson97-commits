<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230">
  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="55%" stop-color="#111836"/>
      <stop offset="100%" stop-color="#221047"/>
    </linearGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="1192" height="222" rx="18" fill="url(#bgGrad)" stroke="url(#neonBorder)" stroke-width="2"/>
  <text x="44" y="48" fill="#00e5ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">
    SOBRE MIM & PROJETOS EM DESTAQUE
  </text>
  <text x="44" y="80" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    Estudante de Análise e Desenvolvimento de Sistemas na UNIBRA, em transição de carreira para tecnologia, com experiência em auditoria, conformidade e resolução de problemas.
  </text>
  <rect x="44" y="104" width="356" height="98" rx="12" fill="#0b1229" stroke="#6366f1" stroke-width="1.5"/><text x="60" y="134" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Triagem Inteligente SUS</text><text x="60" y="162" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">Apoio à triagem com Python, Flask e ML</text><rect x="420" y="104" width="356" height="98" rx="12" fill="#0b1229" stroke="#6366f1" stroke-width="1.5"/><text x="436" y="134" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Auditoria Corporativa</text><text x="436" y="162" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">Controle, conformidade e automações</text><rect x="796" y="104" width="356" height="98" rx="12" fill="#0b1229" stroke="#6366f1" stroke-width="1.5"/><text x="812" y="134" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Bomberman Arena</text><text x="812" y="162" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">Projeto interativo e lógica de jogo</text>
