<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19"/>
      <stop offset="55%" stop-color="#111836"/>
      <stop offset="100%" stop-color="#221047"/>
    </linearGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="1192" height="232" rx="18" fill="url(#bgGrad)" stroke="url(#neonBorder)" stroke-width="2.5"/>
  <circle cx="1010" cy="120" r="78" fill="none" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="1010" cy="120" r="54" fill="none" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="1010" cy="120" r="28" fill="none" stroke="#00e5ff" stroke-width="2" filter="url(#glow)"/>
  <line x1="1010" y1="120" x2="1075" y2="75" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="1075" cy="75" r="5" fill="#e879f9" filter="url(#glow)"/>

  <text x="48" y="62" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">
    SYSTEM ONLINE // GITHUB PROFILE
  </text>
  <text x="48" y="122" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" filter="url(#glow)">
    GLEBSON CARLOS
  </text>
  <text x="48" y="162" fill="#c084fc" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="1.5">
    ADS - UNIBRA | PYTHON, FLASK, WEB & CLOUD AWS
  </text>
  <rect x="48" y="182" width="340" height="4" rx="2" fill="url(#neonBorder)"/>
</svg>
